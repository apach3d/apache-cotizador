<style>
:root{--bg:#f3f5f4;--surface:#fff;--fg:#15221f;--muted:#5c6b67;--line:#d7dedb;--accent:#111111;--accent-fg:#fff;--err:#a3281f;--err-soft:#fbe7e4;
  --f-body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1715;--surface:#17211f;--fg:#e6efec;--muted:#93a39e;--line:#2b3a37;--accent:#f2f2f0;--accent-fg:#111111;--err:#f2a29b;--err-soft:#3b1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1715;--surface:#17211f;--fg:#e6efec;--muted:#93a39e;--line:#2b3a37;--accent:#f2f2f0;--accent-fg:#111111;--err:#f2a29b;--err-soft:#3b1d1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;

main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
h1{font-size:20px;margin:0 0 4px;text-align:center;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--muted);text-align:center}
button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:500;padding:11px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}

button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{margin-top:14px;padding:9px 11px;border-radius:6px;font-size:13px;background:var(--err-soft);color:var(--err)}
.small{margin:16px 0 0;font-size:12px}

  <h1>Cotizador Apache 3D</h1>
  <p>Entra con tu cuenta de Google para ver tus cotizaciones en cualquier dispositivo.</p>
  <button type="button" id="go">Entrar con Google</button>
  <div class="msg" id="msg" hidden role="alert"></div>
  <p class="small">Tus datos solo los ve tu cuenta.</p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,signInWithRedirect,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {firebaseConfig,allowedEmails} from "./firebase-config.js";
const $=id=>document.getElementById(id);
const show=t=>{$('msg').textContent=t;$('msg').hidden=!t};
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('PEGA')){
  $('go').disabled=true;
  show('Falta configurar Firebase. Abre firebase-config.js y pega los datos de tu proyecto (pasos en el README).');
}else{
  const auth=getAuth(initializeApp(firebaseConfig));
  onAuthStateChanged(auth,user=>{
    if(!user)return;
    if(allowedEmails.length&&!allowedEmails.includes(user.email)){
      signOut(auth).then(()=>show('Esta cuenta no tiene acceso: '+user.email));return}
    location.replace('cotizador.html');
  });
  $('go').onclick=async()=>{
    show('');$('go').disabled=true;
    const provider=new GoogleAuthProvider();
    try{await signInWithPopup(auth,provider)}
    catch(e){
      if(e.code==='auth/popup-blocked'){try{await signInWithRedirect(auth,provider);return}catch(e2){e=e2}}
      $('go').disabled=false;
      const m={
        'auth/unauthorized-domain':'Este dominio no está autorizado. En Firebase: Authentication > Configuración > Dominios autorizados, agrega tu dominio de GitHub Pages.',
        'auth/operation-not-allowed':'Falta activar Google en Firebase: Authentication > Método de acceso > Google.',
        'auth/popup-closed-by-user':'Cerraste la ventana antes de terminar. Intenta de nuevo.',
        'auth/cancelled-popup-request':'Intenta de nuevo.',
        'auth/network-request-failed':'Sin conexión. Revisa tu internet.'}[e.code];
      show(m||'No se pudo entrar ('+(e.code||'error')+').');
    }
  };
}
</script>
